name: Fix Google login on mobile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Google login safely
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove every visible G prefix from the Google button.
          text = re.sub(r'<span[^>]*>G</span>\s*Continue with Google', 'Continue with Google', text)
          text = text.replace('>G Connecting...</', '>Connecting...</')
          text = text.replace('>G Continue with Google</', '>Continue with Google</')

          # Replace the complete Google login function, regardless of the old error-handler text.
          start = text.find('async function loginWithGoogle() {')
          if start == -1:
              raise SystemExit('Could not find loginWithGoogle()')

          end = text.find('\n    // <!-- GOOGLE PROFILE DISPLAY ADDED -->', start)
          if end == -1:
              raise SystemExit('Could not find end of loginWithGoogle()')

          new_function = '''async function loginWithGoogle() {
      if (!auth) {
        alert("Firebase is not initialized!");
        return;
      }

      const btn = document.getElementById('google-login-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerText = 'Connecting...';
      }

      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        // Redirect is the recommended Firebase flow for mobile browsers.
        await auth.signInWithRedirect(provider);
      } catch (err) {
        console.error('Google sign-in error:', err);
        if (err.code === 'auth/unauthorized-domain') {
          alert('This website is not authorized in Firebase. Check Authentication → Settings → Authorized domains.');
        } else if (err.code === 'auth/operation-not-supported-in-this-environment') {
          alert('Google login is not supported in this browser environment. Open Life RPG in Chrome or Edge and try again.');
        } else {
          alert('Google login failed: ' + (err.message || err.code));
        }
        if (btn) {
          btn.disabled = false;
          btn.innerText = 'Continue with Google';
        }
      }
    }'''

          text = text[:start] + new_function + text[end:]

          # Add redirect-result handling once, before the auth state listener.
          marker = '// GOOGLE REDIRECT RESULT ADDED'
          if marker not in text:
              redirect_code = '''    // GOOGLE REDIRECT RESULT ADDED
    auth.getRedirectResult().then((result) => {
      if (result && result.user) {
        console.log('Google login successful:', result.user.email);
      }
    }).catch((error) => {
      console.error('Google redirect login error:', error);
      if (error.code === 'auth/unauthorized-domain') {
        console.error('Unauthorized Firebase domain:', window.location.hostname);
      }
    });

'''
              pos = text.find('auth.onAuthStateChanged(')
              if pos == -1:
                  raise SystemExit('Could not find auth.onAuthStateChanged()')
              text = text[:pos] + redirect_code + text[pos:]

          path.write_text(text, encoding='utf-8')
          print('Google mobile login patch applied.')

      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No app changes needed."
            exit 0
          fi
          git commit -m "Fix Google login for mobile"
          git push

      - name: Remove one-time fixer
        if: success()
        run: |
          git rm .github/workflows/fix-google-mobile.yml || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove one-time Google login fixer"
          git push
