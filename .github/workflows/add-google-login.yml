name: Add Google Login

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Google login
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "<!-- GOOGLE LOGIN ADDED -->"
          if marker in text:
              print("Google login is already installed.")
              raise SystemExit(0)

          old_css = """    .auth-btn:active { transform: scale(0.97); }\n\n    .auth-links {"""
          new_css = """    .auth-btn:active { transform: scale(0.97); }\n\n    .google-btn {\n      width: 100%; background: white; color: #202124; border: 1px solid #dadce0;\n      padding: 12px 13px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.95rem;\n      margin-top: 4px; margin-bottom: 4px; transition: all 0.2s ease;\n      display: flex; align-items: center; justify-content: center; gap: 10px;\n    }\n    .google-btn:hover { background: #f8f9fa; }\n    .google-btn:active { transform: scale(0.98); }\n    .google-btn:disabled { opacity: 0.6; cursor: wait; }\n\n    .auth-links {"""
          if old_css not in text:
              raise SystemExit("Could not find auth CSS insertion point")
          text = text.replace(old_css, new_css, 1)

          old_html = """      </form>\n\n      <div class=\"auth-links\">"""
          new_html = """      </form>\n\n      <button type=\"button\" class=\"google-btn\" id=\"google-login-btn\" onclick=\"loginWithGoogle()\">\n        <span style=\"font-size:1.1rem;\">G</span> Continue with Google\n      </button>\n\n      <div class=\"auth-links\">"""
          if old_html not in text:
              raise SystemExit("Could not find auth HTML insertion point")
          text = text.replace(old_html, new_html, 1)

          old_js = """    function toggleAuthMode() {"""
          new_js = """    // <!-- GOOGLE LOGIN ADDED -->\n    async function loginWithGoogle() {\n      if (!auth) {\n        alert(\"Firebase is not initialized!\");\n        return;\n      }\n\n      const btn = document.getElementById('google-login-btn');\n      if (btn) {\n        btn.disabled = true;\n        btn.innerHTML = '<span style=\"font-size:1.1rem;\">G</span> Connecting...';\n      }\n\n      try {\n        const provider = new firebase.auth.GoogleAuthProvider();\n        provider.setCustomParameters({ prompt: 'select_account' });\n        await auth.signInWithPopup(provider);\n        showToast('Welcome to Life RPG! 🎮');\n      } catch (err) {\n        console.error('Google sign-in error:', err);\n\n        if (err.code === 'auth/popup-closed-by-user') {\n          // The user simply closed the Google window; no error message needed.\n        } else if (err.code === 'auth/popup-blocked') {\n          alert('Google login was blocked by your browser. Allow pop-ups for this site and try again.');\n        } else if (err.code === 'auth/account-exists-with-different-credential') {\n          alert('There is already an account with this email using another login method. Log in with that method first.');\n        } else if (err.code === 'auth/unauthorized-domain') {\n          alert('This website is not authorized in Firebase. Add your app domain in Firebase Console → Authentication → Settings → Authorized domains.');\n        } else {\n          alert('Google login failed: ' + (err.message || err.code));\n        }\n      } finally {\n        if (btn) {\n          btn.disabled = false;\n          btn.innerHTML = '<span style=\"font-size:1.1rem;\">G</span> Continue with Google';\n        }\n      }\n    }\n\n    function toggleAuthMode() {"""
          if old_js not in text:
              raise SystemExit("Could not find auth JS insertion point")
          text = text.replace(old_js, new_js, 1)

          path.write_text(text, encoding="utf-8")
          print("Google login code added to index.html")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add Google sign-in button and Firebase Google auth"
          git push
