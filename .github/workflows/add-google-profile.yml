name: Add Google Profile Display

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch profile display
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "<!-- GOOGLE PROFILE DISPLAY ADDED -->"
          if marker in text:
              print("Google profile display is already installed.")
          else:
              old_css = """    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 0.85rem; color: var(--text-muted); }"""
              new_css = old_css + """\n    .hero-profile { display: flex; align-items: center; gap: 8px; min-width: 0; }\n    .profile-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(139, 92, 246, 0.7); display: none; flex-shrink: 0; background: var(--input-bg); }\n    .profile-avatar-fallback { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent), var(--accent-purple)); font-size: 1rem; flex-shrink: 0; }"""
              if old_css not in text:
                  raise SystemExit("Profile CSS insertion point not found")
              text = text.replace(old_css, new_css, 1)

              old_html = """        <span>Hero: <strong id=\"user-display\" style=\"color: var(--text-main);\">Player</strong> <span id=\"network-status\" class=\"status-tag\">🟢 Online</span></span>"""
              new_html = """        <!-- GOOGLE PROFILE DISPLAY ADDED -->\n        <span class=\"hero-profile\">\n          <img id=\"profile-avatar\" class=\"profile-avatar\" alt=\"Google profile\">\n          <span id=\"profile-avatar-fallback\" class=\"profile-avatar-fallback\">🧙</span>\n          <span>Hero: <strong id=\"user-display\" style=\"color: var(--text-main);\">Player</strong> <span id=\"network-status\" class=\"status-tag\">🟢 Online</span></span>\n        </span>"""
              if old_html not in text:
                  raise SystemExit("Profile HTML insertion point not found")
              text = text.replace(old_html, new_html, 1)

              old_js = """    function toggleAuthMode() {"""
              new_js = """    // <!-- GOOGLE PROFILE DISPLAY ADDED -->\n    function updateGoogleProfile(user) {\n      const nameEl = document.getElementById('user-display');\n      const avatarEl = document.getElementById('profile-avatar');\n      const fallbackEl = document.getElementById('profile-avatar-fallback');\n      if (!nameEl) return;\n\n      const displayName = user && user.displayName ? user.displayName : (user && user.email ? user.email.split('@')[0] : 'Hero');\n      nameEl.innerText = displayName;\n\n      if (avatarEl && fallbackEl && user && user.photoURL) {\n        avatarEl.src = user.photoURL;\n        avatarEl.style.display = 'block';\n        fallbackEl.style.display = 'none';\n        avatarEl.onerror = () => {\n          avatarEl.style.display = 'none';\n          fallbackEl.style.display = 'flex';\n        };\n      } else if (avatarEl && fallbackEl) {\n        avatarEl.style.display = 'none';\n        fallbackEl.style.display = 'flex';\n      }\n    }\n\n    function toggleAuthMode() {"""
              if old_js not in text:
                  raise SystemExit("Profile JS insertion point not found")
              text = text.replace(old_js, new_js, 1)

              old_user = """          document.getElementById('user-display').innerText = user.email ? user.email.split('@')[0] : 'Hero';"""
              new_user = """          updateGoogleProfile(user);"""
              if old_user not in text:
                  raise SystemExit("Auth user display line not found")
              text = text.replace(old_user, new_user, 1)

              path.write_text(text, encoding="utf-8")
              print("Google profile name and photo added.")

      - name: Remove one-time workflow
        run: rm -f .github/workflows/add-google-profile.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-google-profile.yml
          git commit -m "Show Google profile name and photo" || exit 0
          git push
