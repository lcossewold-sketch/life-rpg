<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Life RPG</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #6366f1;
      --accent-gold: #f59e0b;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
      --goal-accent: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; max-width: 500px; margin: 0 auto; }

    /* Stats Header */
    .header { background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #2d2d35; }
    .profile { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .level-badge { background: var(--accent); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; }
    .currency { color: var(--accent-gold); font-weight: bold; font-size: 1.1rem; }

    /* Progress bar */
    .progress-container { background: #2d2d35; border-radius: 10px; height: 16px; width: 100%; overflow: hidden; margin-bottom: 6px; }
    .progress-bar { background: linear-gradient(90deg, #4f46e5, #818cf8); height: 100%; width: 0%; transition: width 0.3s ease; }
    .xp-text { font-size: 0.8rem; color: var(--subtext); text-align: right; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px 4px; border: none; background: var(--card); color: var(--subtext); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; text-align: center; }
    .tab-btn.active { background: var(--accent); color: white; }

    /* Section content */
    .section { display: none; }
    .section.active { display: block; }

    /* Forms */
    .add-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid #2d2d35; }
    .form-row { display: flex; gap: 8px; width: 100%; }
    input, select { background: #121214; border: 1px solid #2d2d35; color: var(--text); padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem; }
    input[type="text"] { flex: 1; }
    .btn-add { background: var(--success); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Item list */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border: 1px solid #2d2d35; padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card.goal-card { border-left: 4px solid var(--goal-accent); }
    .card-info h4 { margin-bottom: 4px; font-size: 1rem; }
    .card-info p { font-size: 0.8rem; color: var(--subtext); }
    .badge-xp { color: var(--accent); font-weight: bold; font-size: 0.85rem; }
    .badge-gold { color: var(--accent-gold); font-weight: bold; font-size: 0.85rem; }
    .badge-progress { color: #38bdf8; font-weight: bold; font-size: 0.85rem; }
    
    .actions { display: flex; gap: 6px; align-items: center; }
    .btn-action { background: #2d2d35; border: none; color: var(--text); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-action:hover { background: var(--accent); }
    .btn-count { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-timer { background: #8b5cf6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-delete { background: var(--card); border: 1px solid #3f3f46; color: #ef4444; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-delete:hover { background: var(--danger); color: white; }

    /* Toast effect */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 100; text-align: center; }
  </style>
</head>
<body>

  <!-- Header / Character Sheet -->
  <div class="header">
    <div class="profile">
      <div class="level-badge" id="level">Lvl 1</div>
      <div class="currency">🪙 <span id="gold">0</span> Gold</div>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="xp-bar"></div>
    </div>
    <div class="xp-text"><span id="current-xp">0</span> / <span id="max-xp">100</span> XP</div>
  </div>

  <!-- Tab Navigation -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('quests', this)">⚔️ Quests</button>
    <button class="tab-btn" onclick="switchTab('goals', this)">🎯 Goals</button>
    <button class="tab-btn" onclick="switchTab('shop', this)">🛒 Shop</button>
  </div>

  <!-- QUESTS SECTION -->
  <div id="quests" class="section active">
    <form class="add-form" onsubmit="addQuest(event)">
      <div class="form-row">
        <input type="text" id="quest-title" placeholder="New quest (e.g. Drink water)..." required>
      </div>
      <div class="form-row">
        <select id="quest-type" onchange="toggleQuestInputs()" style="flex: 1;">
          <option value="simple">⚡ Instant Complete</option>
          <option value="counter">🔢 Counter / Count</option>
          <option value="timer">⏱️ Timer (minutes)</option>
        </select>
        <input type="number" id="quest-target" placeholder="Count" value="8" min="1" style="width: 80px; display: none;">
        <select id="quest-xp" style="width: 90px;">
          <option value="25">25 XP</option>
          <option value="50" selected>50 XP</option>
          <option value="100">100 XP</option>
          <option value="250">250 XP</option>
        </select>
        <button type="submit" class="btn-add">+</button>
      </div>
    </form>

    <div class="list" id="quest-list"></div>
  </div>

  <!-- GOALS SECTION -->
  <div id="goals" class="section">
    <form class="add-form" onsubmit="addGoal(event)">
      <div class="form-row">
        <input type="text" id="goal-title" placeholder="Major goal (e.g. Get driver's license)..." required>
      </div>
      <div class="form-row">
        <select id="goal-xp" style="flex: 1;">
          <option value="250">🎯 Small Goal (+250 XP / +100 Gold)</option>
          <option value="500" selected>🏆 Medium Goal (+500 XP / +200 Gold)</option>
          <option value="1000">👑 Epic Goal (+1000 XP / +400 Gold)</option>
          <option value="2500">🌟 Milestone (+2500 XP / +1000 Gold)</option>
        </select>
        <button type="submit" class="btn-add">+</button>
      </div>
    </form>

    <div class="list" id="goal-list"></div>
  </div>

  <!-- SHOP SECTION -->
  <div id="shop" class="section">
    <form class="add-form" onsubmit="addShopItem(event)">
      <div class="form-row">
        <input type="text" id="item-title" placeholder="Reward (e.g. 1 hour gaming)..." required>
        <input type="number" id="item-cost" placeholder="Gold" style="width: 80px;" required>
        <button type="submit" class="btn-add">+</button>
      </div>
    </form>

    <div class="list" id="shop-list"></div>
  </div>

  <div class="toast" id="toast">Quest Completed! 🎉</div>

  <script>
    // State management
    let defaultState = {
      xp: 0,
      level: 1,
      gold: 0,
      quests: [
        { id: 1, title: 'Drink 8 glasses of water', type: 'counter', current: 0, target: 8, xp: 50, gold: 20 },
        { id: 2, title: 'Study or read for 15 mins', type: 'timer', remainingSeconds: 15 * 60, targetSeconds: 15 * 60, isRunning: false, xp: 100, gold: 40 },
        { id: 3, title: 'Clean room', type: 'simple', xp: 100, gold: 40 }
      ],
      goals: [
        { id: 1, title: 'Get driver\'s license 🚗', xp: 1000, gold: 400 },
        { id: 2, title: 'Lose 5kg 💪', xp: 500, gold: 200 }
      ],
      shop: [
        { id: 1, title: 'Watch 1 TV episode', cost: 30 },
        { id: 2, title: 'Guilt-free gaming evening', cost: 100 }
      ]
    };

    let state = JSON.parse(localStorage.getItem('lifeRPG')) || defaultState;
    if (!state.goals) state.goals = defaultState.goals;

    function save() {
      localStorage.setItem('lifeRPG', JSON.stringify(state));
      render();
    }

    function toggleQuestInputs() {
      const type = document.getElementById('quest-type').value;
      const targetInput = document.getElementById('quest-target');
      if (type === 'counter') {
        targetInput.style.display = 'block';
        targetInput.placeholder = 'Target';
        targetInput.value = 8;
      } else if (type === 'timer') {
        targetInput.style.display = 'block';
        targetInput.placeholder = 'Minutes';
        targetInput.value = 15;
      } else {
        targetInput.style.display = 'none';
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function render() {
      const maxXp = state.level * 100;
      
      // Update Stats
      document.getElementById('level').innerText = `Lvl ${state.level}`;
      document.getElementById('gold').innerText = state.gold;
      document.getElementById('current-xp').innerText = state.xp;
      document.getElementById('max-xp').innerText = maxXp;
      document.getElementById('xp-bar').style.width = `${Math.min((state.xp / maxXp) * 100, 100)}%`;

      // Render Quests
      const questList = document.getElementById('quest-list');
      questList.innerHTML = state.quests.length === 0 ? '<p style="color:var(--subtext); text-align:center; padding: 20px 0;">No active quests. Add one above!</p>' : '';
      
      state.quests.forEach(q => {
        let actionButtons = '';
        let extraBadge = '';

        if (q.type === 'counter') {
          extraBadge = ` • <span class="badge-progress">Progress: ${q.current}/${q.target}</span>`;
          actionButtons = `
            <button class="btn-count" onclick="incrementCounter(${q.id})">+1</button>
            <button class="btn-action" onclick="completeQuest(${q.id})">✓</button>
          `;
        } else if (q.type === 'timer') {
          extraBadge = ` • <span class="badge-progress" id="time-disp-${q.id}">⏱️ ${formatTime(q.remainingSeconds)}</span>`;
          const playBtnText = q.isRunning ? '⏸️' : '▶️';
          actionButtons = `
            <button class="btn-timer" onclick="toggleTimer(${q.id})">${playBtnText}</button>
            <button class="btn-action" onclick="completeQuest(${q.id})">✓</button>
          `;
        } else {
          actionButtons = `
            <button class="btn-action" onclick="completeQuest(${q.id})">✓</button>
          `;
        }

        questList.innerHTML += `
          <div class="card">
            <div class="card-info">
              <h4>${q.title}</h4>
              <p><span class="badge-xp">+${q.xp} XP</span> • <span class="badge-gold">+${q.gold} Gold</span>${extraBadge}</p>
            </div>
            <div class="actions">
              ${actionButtons}
              <button class="btn-delete" onclick="deleteQuest(${q.id})">🗑️</button>
            </div>
          </div>
        `;
      });

      // Render Goals
      const goalList = document.getElementById('goal-list');
      goalList.innerHTML = state.goals.length === 0 ? '<p style="color:var(--subtext); text-align:center; padding: 20px 0;">No major goals set. Dream big and add one!</p>' : '';
      
      state.goals.forEach(g => {
        goalList.innerHTML += `
          <div class="card goal-card">
            <div class="card-info">
              <h4>🎯 ${g.title}</h4>
              <p><span class="badge-xp">+${g.xp} XP</span> • <span class="badge-gold">+${g.gold} Gold</span></p>
            </div>
            <div class="actions">
              <button class="btn-action" style="background:var(--goal-accent); color:white;" onclick="completeGoal(${g.id})">🏆 Complete</button>
              <button class="btn-delete" onclick="deleteGoal(${g.id})">🗑️</button>
            </div>
          </div>
        `;
      });

      // Render Shop
      const shopList = document.getElementById('shop-list');
      shopList.innerHTML = state.shop.length === 0 ? '<p style="color:var(--subtext); text-align:center; padding: 20px 0;">No rewards in the shop.</p>' : '';
      state.shop.forEach(s => {
        shopList.innerHTML += `
          <div class="card">
            <div class="card-info">
              <h4>${s.title}</h4>
              <p><span class="badge-gold">${s.cost} Gold</span></p>
            </div>
            <div class="actions">
              <button class="btn-action" onclick="buyItem(${s.id})">Buy</button>
              <button class="btn-delete" onclick="deleteShopItem(${s.id})">🗑️</button>
            </div>
          </div>
        `;
      });
    }

    function addQuest(e) {
      e.preventDefault();
      const title = document.getElementById('quest-title').value;
      const type = document.getElementById('quest-type').value;
      const xp = parseInt(document.getElementById('quest-xp').value);
      const gold = Math.round(xp / 2.5);
      const targetVal = parseInt(document.getElementById('quest-target').value) || 1;

      const newQuest = { id: Date.now(), title, type, xp, gold };

      if (type === 'counter') {
        newQuest.current = 0;
        newQuest.target = targetVal;
      } else if (type === 'timer') {
        newQuest.targetSeconds = targetVal * 60;
        newQuest.remainingSeconds = targetVal * 60;
        newQuest.isRunning = false;
      }

      state.quests.push(newQuest);
      document.getElementById('quest-title').value = '';
      save();
    }

    function addGoal(e) {
      e.preventDefault();
      const title = document.getElementById('goal-title').value;
      const xp = parseInt(document.getElementById('goal-xp').value);
      const gold = Math.round(xp / 2.5);

      state.goals.push({ id: Date.now(), title, xp, gold });
      document.getElementById('goal-title').value = '';
      save();
    }

    function incrementCounter(id) {
      const q = state.quests.find(item => item.id === id);
      if (!q) return;

      q.current += 1;
      if (q.current >= q.target) {
        completeQuest(id);
      } else {
        save();
        showToast(`Progress: ${q.current}/${q.target}!`);
      }
    }

    function toggleTimer(id) {
      const q = state.quests.find(item => item.id === id);
      if (!q) return;

      q.isRunning = !q.isRunning;
      save();
    }

    function addRewards(xpGained, goldGained) {
      state.xp += xpGained;
      state.gold += goldGained;

      let maxXp = state.level * 100;
      let levelUps = 0;
      while (state.xp >= maxXp) {
        state.xp -= maxXp;
        state.level += 1;
        levelUps++;
        maxXp = state.level * 100;
      }

      if (levelUps > 0) {
        showToast(`🎉 LEVEL UP! You reached Level ${state.level}! 🎉`);
      } else {
        showToast(`+${xpGained} XP | +${goldGained} Gold!`);
      }
    }

    function completeQuest(id) {
      const quest = state.quests.find(q => q.id === id);
      if (!quest) return;

      addRewards(quest.xp, quest.gold);
      state.quests = state.quests.filter(q => q.id !== id);
      save();
    }

    function completeGoal(id) {
      const goal = state.goals.find(g => g.id === id);
      if (!goal) return;

      if (confirm(`Congratulations on completing: "${goal.title}"! Mark goal as finished?`)) {
        addRewards(goal.xp, goal.gold);
        state.goals = state.goals.filter(g => g.id !== id);
        save();
      }
    }

    function deleteQuest(id) {
      state.quests = state.quests.filter(q => q.id !== id);
      save();
      showToast('Quest deleted');
    }

    function deleteGoal(id) {
      state.goals = state.goals.filter(g => g.id !== id);
      save();
      showToast('Goal deleted');
    }

    function addShopItem(e) {
      e.preventDefault();
      const title = document.getElementById('item-title').value;
      const cost = parseInt(document.getElementById('item-cost').value);

      state.shop.push({ id: Date.now(), title, cost });
      document.getElementById('item-title').value = '';
      document.getElementById('item-cost').value = '';
      save();
    }

    function buyItem(id) {
      const item = state.shop.find(s => s.id === id);
      if (!item) return;

      if (state.gold >= item.cost) {
        state.gold -= item.cost;
        showToast(`Purchased: ${item.title}! Enjoy! 🎁`);
        save();
      } else {
        alert('Not enough gold! Complete more quests first.');
      }
    }

    function deleteShopItem(id) {
      state.shop = state.shop.filter(s => s.id !== id);
      save();
      showToast('Reward deleted');
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    // Timer Tick Interval (Every second)
    setInterval(() => {
      state.quests.forEach(q => {
        if (q.type === 'timer' && q.isRunning) {
          if (q.remainingSeconds > 0) {
            q.remainingSeconds--;
            const disp = document.getElementById(`time-disp-${q.id}`);
            if (disp) disp.innerText = `⏱️ ${formatTime(q.remainingSeconds)}`;
          } else {
            q.isRunning = false;
            completeQuest(q.id);
          }
        }
      });
    }, 1000);

    // Initial render
    render();
  </script>
</body>
</html>
