<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Zorgt dat de app op mobiel goed schaalt en eruitziet als een echte app -->
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Life RPG">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Life RPG</title>

  <!-- Howler.js bibliotheek voor geluiden -->
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.3/dist/howler.min.js" crossorigin="anonymous"></script>

  <!-- Firebase Web SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #6366f1;
      --accent-gold: #f59e0b;
      --text: #f3f4f6;
      --subtext: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
      --goal-accent: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 40px; max-width: 500px; margin: 0 auto; }

    /* AUTH / LOGIN SCREEN */
    #auth-screen { display: flex; flex-direction: column; justify-content: center; min-height: 80vh; }
    .auth-card { background: var(--card); padding: 24px; border-radius: 16px; border: 1px solid #2d2d35; text-align: left; }
    .auth-card h2 { margin-bottom: 6px; color: var(--accent); text-align: center; }
    .auth-card p.subtitle { color: var(--subtext); margin-bottom: 20px; font-size: 0.85rem; text-align: center; }
    
    .input-label { display: block; color: var(--text); font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; margin-top: 12px; }
    .auth-card input { width: 100%; margin-bottom: 4px; }

    /* Password Input with Eye Icon */
    .password-container { position: relative; width: 100%; margin-bottom: 4px; }
    .password-container input { width: 100%; padding-right: 40px; margin-bottom: 0; }
    .toggle-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--subtext); cursor: pointer; font-size: 1.1rem; }

    .auth-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 16px; margin-bottom: 12px; }
    .auth-links { display: flex; flex-direction: column; gap: 10px; text-align: center; margin-top: 8px; }
    
    .auth-toggle, .auth-forgot { 
      background: none; 
      border: none; 
      color: var(--subtext); 
      font-size: 0.85rem; 
      cursor: pointer; 
      text-decoration: underline; 
      font-family: inherit;
    }
    .auth-forgot { color: var(--accent-gold); }

    /* MAIN APP */
    #app-screen { display: none; }

    /* Stats Header */
    .header { background: var(--card); padding: 16px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #2d2d35; position: relative; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.85rem; color: var(--subtext); }
    .status-tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #2d2d35; margin-left: 6px; }
    .profile { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .level-badge { background: var(--accent); color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 1.1rem; }
    .currency { color: var(--accent-gold); font-weight: bold; font-size: 1.1rem; }

    /* Progress bar */
    .progress-container { background: #2d2d35; border-radius: 10px; height: 16px; width: 100%; overflow: hidden; margin-bottom: 6px; }
    .progress-bar { background: linear-gradient(90deg, #4f46e5, #818cf8); height: 100%; width: 0%; transition: width 0.3s ease; }
    .xp-text { font-size: 0.8rem; color: var(--subtext); text-align: right; }

    /* Buttons in Header */
    .header-btns { display: flex; gap: 6px; }
    .icon-btn { background: #2d2d35; border: none; color: var(--text); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab-btn { flex: 1; padding: 10px 4px; border: none; background: var(--card); color: var(--subtext); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; text-align: center; }
    .tab-btn.active { background: var(--accent); color: white; }

    /* Section content */
    .section { display: none; }
    .section.active { display: block; }

    /* Forms */
    .add-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid #2d2d35; }
    .form-row { display: flex; gap: 8px; width: 100%; }
    input, select { background: #121214; border: 1px solid #2d2d35; color: var(--text); padding: 10px; border-radius: 8px; outline: none; font-size: 0.9rem; }
    input[type="text"], input[type="email"], input[type="password"] { flex: 1; }
    
    /* Styling voor datum-invoerveld */
    input[type="datetime-local"] { 
      color: #ffffff !important; 
      background-color: #2d2d35 !important;
      border: 1px solid #3f3f46 !important;
      color-scheme: dark;
      font-size: 0.85rem;
    }

    .btn-add { background: var(--success); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    /* Item list */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border: 1px solid #2d2d35; padding: 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    .card.goal-card { border-left: 4px solid var(--goal-accent); }
    .card-info h4 { margin-bottom: 4px; font-size: 1rem; }
    .card-info p { font-size: 0.8rem; color: var(--subtext); }
    .badge-xp { color: var(--accent); font-weight: bold; font-size: 0.85rem; }
    .badge-gold { color: var(--accent-gold); font-weight: bold; font-size: 0.85rem; }
    .badge-progress { color: #38bdf8; font-weight: bold; font-size: 0.85rem; }
    .badge-due { color: #f43f5e; font-weight: bold; font-size: 0.8rem; display: inline-block; margin-top: 2px; }
    
    .actions { display: flex; gap: 4px; align-items: center; }
    .btn-action { background: #2d2d35; border: none; color: var(--text); padding: 8px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    .btn-action:hover { background: var(--accent); }
    .btn-count { background: #3b82f6; color: white; border: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-minus { background: #4b5563; color: white; border: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-timer { background: #8b5cf6; color: white; border: none; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-delete { background: var(--card); border: 1px solid #3f3f46; color: #ef4444; padding: 8px 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* Toast */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: white; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 100; text-align: center; }

    /* MODALS */
    .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 200; }
    .modal-content { background: var(--card); border: 1px solid var(--accent); padding: 20px; border-radius: 16px; max-width: 400px; width: 100%; text-align: center; }
    .modal-content h3 { color: var(--accent); margin-bottom: 10px; }
    .modal-content p { color: var(--subtext); font-size: 0.95rem; line-height: 1.4; margin-bottom: 20px; }
    .modal-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">🎮 Welcome to Life RPG</h2>
      <p class="subtitle" id="auth-sub">Log in with your account to continue</p>
      
      <form onsubmit="handleAuth(event)">
        <label class="input-label" for="auth-email">Email Address</label>
        <input type="email" id="auth-email" placeholder="e.g. hero@example.com" required>
        
        <label class="input-label" for="auth-pass">Password</label>
        <div class="password-container">
          <input type="password" id="auth-pass" placeholder="At least 6 characters" required>
          <button type="button" class="toggle-eye" id="eye-btn" onclick="togglePasswordVisibility('auth-pass', 'eye-btn')">👁️</button>
        </div>

        <button type="submit" class="auth-btn" id="auth-submit-btn">Login</button>
      </form>

      <div class="auth-links">
        <button type="button" class="auth-toggle" id="auth-toggle-btn" onclick="toggleAuthMode()">Need an account? Register here</button>
        <button type="button" class="auth-forgot" id="auth-forgot-btn" onclick="sendPasswordReset()">Forgot password?</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen">
    <div class="header">
      <div class="top-bar">
        <span>Hero: <strong id="user-display" style="color: var(--text);">Player</strong> <span id="network-status" class="status-tag">🟢 Online</span></span>
        <div class="header-btns">
          <button class="icon-btn" onclick="requestNotificationPermission()">🔔 Meldingen</button>
          <button class="icon-btn" onclick="startTutorial()">❓ Help</button>
          <button class="icon-btn" onclick="logout()">🚪 Logout</button>
        </div>
      </div>
      <div class="profile">
        <div class="level-badge" id="level">Lvl 1</div>
        <div class="currency">🪙 <span id="gold">0</span> Gold</div>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="xp-bar"></div>
      </div>
      <div class="xp-text"><span id="current-xp">0</span> / <span id="max-xp">100</span> XP</div>
    </div>

    <!-- Tab Navigation -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('quests', this)">⚔️ Quests</button>
      <button class="tab-btn" onclick="switchTab('goals', this)">🎯 Goals</button>
      <button class="tab-btn" onclick="switchTab('shop', this)">🛒 Shop</button>
    </div>

    <!-- QUESTS SECTION -->
    <div id="quests" class="section active">
      <form class="add-form" onsubmit="addQuest(event)">
        <div class="form-row">
          <input type="text" id="quest-title" placeholder="New daily quest..." required>
        </div>
        <div class="form-row">
          <select id="quest-type" onchange="toggleQuestInputs()" style="flex: 1;">
            <option value="simple">⚡ Instant Complete</option>
            <option value="counter">🔢 Counter / Count</option>
            <option value="timer">⏱️ Timer (minutes)</option>
          </select>
          <input type="number" id="quest-target" placeholder="Count" value="8" min="1" style="width: 80px; display: none;">
          <select id="quest-xp" style="width: 90px;">
            <option value="25">25 XP</option>
            <option value="50" selected>50 XP</option>
            <option value="100">100 XP</option>
            <option value="250">250 XP</option>
          </select>
        </div>

        <div style="margin-top: 2px;">
          <label for="quest-due" style="font-size: 0.8rem; color: var(--subtext); display: block; margin-bottom: 4px;">⏰ Deadline (optional):</label>
          <div class="form-row">
            <input type="datetime-local" id="quest-due" style="width: 100%; flex: 1;">
            <button type="submit" class="btn-add">+</button>
          </div>
        </div>
      </form>
      <div class="list" id="quest-list"></div>
    </div>

    <!-- GOALS SECTION -->
    <div id="goals" class="section">
      <form class="add-form" onsubmit="addGoal(event)">
        <div class="form-row">
          <input type="text" id="goal-title" placeholder="Major life goal..." required>
        </div>
        <div class="form-row">
          <select id="goal-xp" style="flex: 1;">
            <option value="250">🎯 Small Goal (+250 XP)</option>
            <option value="500" selected>🏆 Medium Goal (+500 XP)</option>
            <option value="1000">👑 Epic Goal (+1000 XP)</option>
          </select>
          <button type="submit" class="btn-add">+</button>
        </div>
      </form>
      <div class="list" id="goal-list"></div>
    </div>

    <!-- SHOP SECTION -->
    <div id="shop" class="section">
      <form class="add-form" onsubmit="addShopItem(event)">
        <div class="form-row">
          <input type="text" id="item-title" placeholder="Reward (e.g. 1hr gaming)..." required>
          <input type="number" id="item-cost" placeholder="Gold" style="width: 80px;" required>
          <button type="submit" class="btn-add">+</button>
        </div>
      </form>
      <div class="list" id="shop-list"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- TUTORIAL MODAL -->
  <div class="modal-overlay" id="tutorial-modal">
    <div class="modal-content">
      <h3 id="tut-title">Welcome Hero! 🛡️</h3>
      <p id="tut-body">Turn your real life into an RPG! Complete daily tasks, level up, earn gold, and reward yourself.</p>
      <button class="modal-btn" id="tut-btn" onclick="nextTutorialStep()">Next ➡️</button>
    </div>
  </div>

  <script>
    // GLOBAL UI & NETWORK MONITORING
    let isRegisterMode = false;

    function updateNetworkStatus() {
      const statusTag = document.getElementById('network-status');
      if (navigator.onLine) {
        statusTag.innerText = '🟢 Online';
        statusTag.style.color = '#10b981';
        syncDataWithCloud(); // Automatisch synchroniseren zodra we weer internet hebben!
      } else {
        statusTag.innerText = '🔴 Offline';
        statusTag.style.color = '#ef4444';
      }
    }

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? '✨ Create Account' : '🎮 Welcome to Life RPG';
      document.getElementById('auth-sub').innerText = isRegisterMode ? 'Register a new account to get started' : 'Log in with your account to continue';
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Register' : 'Login';
      document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? 'Already have an account? Login' : 'Need an account? Register here';
    }

    function sendPasswordReset() {
      const email = prompt('Enter your email address to receive a password reset link:');
      if (email) {
        if (typeof auth === 'undefined' || !auth) {
          alert('Firebase is not initialized!');
          return;
        }
        auth.sendPasswordResetEmail(email.trim())
          .then(() => alert('Password reset email sent! Check your inbox.'))
          .catch(err => alert('Error: ' + err.message));
      }
    }

    function togglePasswordVisibility(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn = document.getElementById(btnId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = '🙈';
      } else {
        input.type = 'password';
        btn.innerText = '👁️';
      }
    }

    // MELDINGEN
    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        alert('Je browser ondersteunt helaas geen mobiele notificaties.');
        return;
      }

      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          showToast('🔔 Meldingen staan nu AAN!');
          sendNotification('🎮 Life RPG', 'Meldingen zijn succesvol ingeschakeld!');
        } else if (permission === 'denied') {
          alert('Je hebt meldingen geblokkeerd. Zet dit aan via je browserinstellingen.');
        }
      });
    }

    function sendNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, {
              body: body,
              icon: 'https://cdn-icons-png.flaticon.com/512/3408/3408506.png',
              vibrate: [200, 100, 200],
              tag: 'life-rpg-notification'
            });
          });
        } else {
          new Notification(title, { body: body });
        }
      }
    }

    // FIREBASE INITIALISATIE
    const firebaseConfig = {
      apiKey: "AIzaSyD2FPl7SpLniSCgYNimRx8LGLmECIpVKck",
      authDomain: "life-rpg-eaa3e.firebaseapp.com",
      databaseURL: "https://life-rpg-eaa3e-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "life-rpg-eaa3e",
      storageBucket: "life-rpg-eaa3e.firebasestorage.app",
      messagingSenderId: "119046286545",
      appId: "1:119046286545:web:df65b5743c19b1f7b269f0"
    };

    let auth, database;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      database = firebase.database();
      
      // Zorg dat de login-status offline behouden blijft op het apparaat
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    } catch (e) {
      console.error("Firebase config fout:", e);
    }

    let currentUser = null;
    let userData = null;

    let defaultUserData = {
      xp: 0,
      level: 1,
      gold: 0,
      hasSeenTutorial: false,
      quests: [
        { id: 1, title: 'Drink 8 glasses of water', type: 'counter', current: 0, target: 8, xp: 50, gold: 20 },
        { id: 2, title: 'Clean room', type: 'simple', xp: 100, gold: 40 }
      ],
      goals: [
        { id: 1, title: "Get driver's license 🚗", xp: 1000, gold: 400 }
      ],
      shop: [
        { id: 1, title: 'Watch 1 TV episode', cost: 30 }
      ]
    };

    // OPSTARTEN & DUAL-STORAGE LOGICA (OFFLINE FIRST)
    function loadLocalData() {
      const saved = localStorage.getItem('lifeRpgUserData');
      if (saved) {
        try {
          return JSON.parse(saved);
        } catch (e) { console.error('Fout bij laden van local data', e); }
      }
      return null;
    }

    // Probeer direct lokaal te laden zodat de app METEEN opent (ook zonder internet)
    const cachedLocal = loadLocalData();
    if (cachedLocal) {
      userData = cachedLocal;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      render();
    }

    if (auth) {
      auth.onAuthStateChanged(async (user) => {
        updateNetworkStatus();
        if (user) {
          currentUser = user;
          document.getElementById('user-display').innerText = user.email.split('@')[0];
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('app-screen').style.display = 'block';

          // Als we online zijn, halen we de nieuwste data op uit de Firebase Cloud
          if (navigator.onLine) {
            try {
              const snapshot = await database.ref('users/' + user.uid).once('value');
              if (snapshot.exists()) {
                userData = snapshot.val();
                if (!userData.quests) userData.quests = [];
                if (!userData.goals) userData.goals = [];
                if (!userData.shop) userData.shop = [];
              } else if (!userData) {
                userData = JSON.parse(JSON.stringify(defaultUserData));
                await database.ref('users/' + user.uid).set(userData);
              }
            } catch (err) {
              console.log('Kon clouddata niet ophalen, we gebruiken lokale data.');
            }
          }

          if (!userData) userData = JSON.parse(JSON.stringify(defaultUserData));
          saveLocally();
          render();

          if (!userData.hasSeenTutorial) {
            startTutorial();
          }
        } else {
          // Als er geen gecachte sessie/lokale data is, toon inlogscherm
          if (!cachedLocal) {
            currentUser = null;
            userData = null;
            document.getElementById('app-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
          }
        }
      });
    }

    async function handleAuth(e) {
      e.preventDefault();
      if (!auth) { alert("Firebase is niet geïnitialiseerd!"); return; }

      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-pass').value.trim();

      try {
        if (isRegisterMode) {
          await auth.createUserWithEmailAndPassword(email, pass);
          showToast('Account created! Welcome!');
        } else {
          await auth.signInWithEmailAndPassword(email, pass);
          showToast('Welcome back!');
        }
      } catch (err) {
        alert('Authentication Error: ' + err.message);
      }
    }

    function logout() {
      localStorage.removeItem('lifeRpgUserData');
      if (auth) auth.signOut();
      window.location.reload();
    }

    function saveLocally() {
      if (userData) {
        localStorage.setItem('lifeRpgUserData', JSON.stringify(userData));
      }
    }

    async function syncDataWithCloud() {
      if (currentUser && userData && database && navigator.onLine) {
        try {
          await database.ref('users/' + currentUser.uid).set(userData);
          console.log('Cloud-synchronisatie voltooid!');
        } catch (e) {
          console.error('Cloud-sync mislukt:', e);
        }
      }
    }

    function save() {
      saveLocally();      // 1. Altijd direct lokaal opslaan (bliksemsnel)
      syncDataWithCloud(); // 2. Synchroniseren met Firebase als er Wi-Fi is
      render();
    }

    // TUTORIAL SYSTEM
    let tutStep = 0;
    const tutSteps = [
      { title: "Welcome Hero! 🛡️", body: "Turn your real life into an RPG! Complete daily tasks, level up, earn gold, and reward yourself." },
      { title: "⚔️ Quests", body: "Add daily habits or tasks. Set deadlines, counters, or timers! Complete them on time to earn XP and Gold." },
      { title: "🎯 Goals", body: "Set big, long-term achievements (like passing an exam or losing weight). These give massive XP and Gold bonuses!" },
      { title: "🛒 The Shop", body: "Use your hard-earned Gold to buy real-life rewards you create (e.g., 1 hour of gaming, watching a movie, or a treat)." }
    ];

    function startTutorial() {
      tutStep = 0;
      showTutStep();
      document.getElementById('tutorial-modal').style.display = 'flex';
    }

    function showTutStep() {
      document.getElementById('tut-title').innerText = tutSteps[tutStep].title;
      document.getElementById('tut-body').innerText = tutSteps[tutStep].body;
      document.getElementById('tut-btn').innerText = tutStep === tutSteps.length - 1 ? "Let's Play! 🚀" : "Next ➡️";
    }

    function nextTutorialStep() {
      tutStep++;
      if (tutStep < tutSteps.length) {
        showTutStep();
      } else {
        document.getElementById('tutorial-modal').style.display = 'none';
        userData.hasSeenTutorial = true;
        save();
      }
    }

    // UI & TAB LOGIC
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    function toggleQuestInputs() {
      const type = document.getElementById('quest-type').value;
      const targetInput = document.getElementById('quest-target');
      if (type === 'counter') {
        targetInput.style.display = 'block';
        targetInput.placeholder = 'Target';
        targetInput.value = 8;
      } else if (type === 'timer') {
        targetInput.style.display = 'block';
        targetInput.placeholder = 'Minutes';
        targetInput.value = 15;
      } else {
        targetInput.style.display = 'none';
      }
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function render() {
      if (!userData) return;
      const maxXp = userData.level * 100;

      document.getElementById('level').innerText = `Lvl ${userData.level}`;
      document.getElementById('gold').innerText = userData.gold;
      document.getElementById('current-xp').innerText = userData.xp;
      document.getElementById('max-xp').innerText = maxXp;
      document.getElementById('xp-bar').style.width = `${Math.min((userData.xp / maxXp) * 100, 100)}%`;

      // Render Quests
      const questList = document.getElementById('quest-list');
      const quests = userData.quests || [];
      questList.innerHTML = quests.length === 0 ? '<p style="color:var(--subtext); text-align:center; padding: 20px 0;">No active quests.</p>' : '';
      
      quests.forEach(q => {
        let actionButtons = '';
        let extraBadge = '';
        let dueBadge = '';

        if (q.dueDate) {
          const d = new Date(q.dueDate);
          const formattedDate = d.toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
          dueBadge = `<br><span class="badge-due">⏳ Due: ${formattedDate}</span>`;
        }

        if (q.type === 'counter') {
          extraBadge = ` • <span class="badge-progress">Progress: ${q.current}/${q.target}</span>`;
          actionButtons = `
            <button class="btn-minus" onclick="decrementCounter(${q.id})">-1</button>
            <button class="btn-count" onclick="incrementCounter(${q.id})">+1</button> 
            <button class="btn-action" onclick="completeQuest(${q.id})">✓</button>
          `;
        } else if (q.type === 'timer') {
          extraBadge = ` • <span class="badge-progress" id="time-disp-${q.id}">⏱️ ${formatTime(q.remainingSeconds)}</span>`;
          const playBtnText = q.isRunning ? '⏸️' : '▶️';
          actionButtons = `<button class="btn-timer" onclick="toggleTimer(${q.id})">${playBtnText}</button> <button class="btn-action" onclick="completeQuest(${q.id})">✓</button>`;
        } else {
          actionButtons = `<button class="btn-action" onclick="completeQuest(${q.id})">✓</button>`;
        }

        questList.innerHTML += `
          <div class="card">
            <div class="card-info">
              <h4>${q.title}</h4>
              <p><span class="badge-xp">+${q.xp} XP</span> • <span class="badge-gold">+${q.gold} Gold</span>${extraBadge}${dueBadge}</p>
            </div>
            <div class="actions">
              ${actionButtons}
              <button class="btn-delete" onclick="deleteQuest(${q.id})">🗑️</button>
            </div>
          </div>
        `;
      });

      // Render Goals
      const goalList = document.getElementById('goal-list');
      const goals = userData.goals || [];
      goalList.innerHTML = goals.length === 0 ? '<p style="color:var(--subtext); text-align:center; padding: 20px 0;">No major goals set.</p>' : '';
      goals.forEach(g => {
        goalList.innerHTML += `
          <div class="card goal-card">
            <div class="card-info">
              <h4>🎯 ${g.title}</h4>
              <p><span class="badge-xp">+${g.xp} XP</span> • <span class="badge-gold">+${g.gold} Gold</span></p>
            </div>
            <div class="actions">
              <button class="btn-action" style="background:var(--goal-accent); color:white;" onclick="completeGoal(${g.id})">🏆 Complete</button>
              <button class="btn-delete" onclick="deleteGoal(${g.id})">🗑️</button>
            </div>
          </div>
        `;
      });

      // Render Shop
      const shopList = document.getElementById('shop-list');
      const shop = userData.shop || [];
      shopList.innerHTML = shop.length === 0 ? '<p style="color:var(--subtext); text-align:center; padding: 20px 0;">No rewards in shop.</p>' : '';
      shop.forEach(s => {
        shopList.innerHTML += `
          <div class="card">
            <div class="card-info">
              <h4>${s.title}</h4>
              <p><span class="badge-gold">${s.cost} Gold</span></p>
            </div>
            <div class="actions">
              <button class="btn-action" onclick="buyItem(${s.id})">Buy</button>
              <button class="btn-delete" onclick="deleteShopItem(${s.id})">🗑️</button>
            </div>
          </div>
        `;
      });
    }

    // ACTIONS & DATA MANIPULATION
    function addQuest(e) {
      e.preventDefault();
      const title = document.getElementById('quest-title').value;
      const type = document.getElementById('quest-type').value;
      const xp = parseInt(document.getElementById('quest-xp').value);
      const gold = Math.round(xp / 2.5);
      const targetVal = parseInt(document.getElementById('quest-target').value) || 1;
      const dueVal = document.getElementById('quest-due').value;

      const newQuest = { id: Date.now(), title, type, xp, gold, warned: false };
      if (dueVal) newQuest.dueDate = dueVal;
      if (type === 'counter') { newQuest.current = 0; newQuest.target = targetVal; }
      else if (type === 'timer') { newQuest.targetSeconds = targetVal * 60; newQuest.remainingSeconds = targetVal * 60; newQuest.isRunning = false; }

      if (!userData.quests) userData.quests = [];
      userData.quests.push(newQuest);
      document.getElementById('quest-title').value = '';
      document.getElementById('quest-due').value = '';
      save();
    }

    function addGoal(e) {
      e.preventDefault();
      const title = document.getElementById('goal-title').value;
      const xp = parseInt(document.getElementById('goal-xp').value);
      const gold = Math.round(xp / 2.5);

      if (!userData.goals) userData.goals = [];
      userData.goals.push({ id: Date.now(), title, xp, gold });
      document.getElementById('goal-title').value = '';
      save();
    }

    function incrementCounter(id) {
      const q = userData.quests.find(item => item.id === id);
      if (!q) return;
      q.current += 1;
      if (q.current >= q.target) completeQuest(id);
      else { save(); showToast(`Progress: ${q.current}/${q.target}!`); }
    }

    function decrementCounter(id) {
      const q = userData.quests.find(item => item.id === id);
      if (!q) return;
      if (q.current > 0) {
        q.current -= 1;
        save();
        showToast(`Progress: ${q.current}/${q.target}`);
      }
    }

    function toggleTimer(id) {
      const q = userData.quests.find(item => item.id === id);
      if (!q) return;
      q.isRunning = !q.isRunning;
      save();
    }

    function addRewards(xpGained, goldGained) {
      userData.xp += xpGained;
      userData.gold += goldGained;

      let maxXp = userData.level * 100;
      let levelUps = 0;
      while (userData.xp >= maxXp) {
        userData.xp -= maxXp;
        userData.level += 1;
        levelUps++;
        maxXp = userData.level * 100;
      }

      if (levelUps > 0) showToast(`🎉 LEVEL UP! Level ${userData.level}! 🎉`);
      else showToast(`+${xpGained} XP | +${goldGained} Gold!`);
    }

    function completeQuest(id) {
      const quest = userData.quests.find(q => q.id === id);
      if (!quest) return;
      addRewards(quest.xp, quest.gold);
      userData.quests = userData.quests.filter(q => q.id !== id);
      save();
    }

    function completeGoal(id) {
      const goal = userData.goals.find(g => g.id === id);
      if (!goal) return;
      if (confirm(`Completed: "${goal.title}"?`)) {
        addRewards(goal.xp, goal.gold);
        userData.goals = userData.goals.filter(g => g.id !== id);
        save();
      }
    }

    function deleteQuest(id) { userData.quests = userData.quests.filter(q => q.id !== id); save(); }
    function deleteGoal(id) { userData.goals = userData.goals.filter(g => g.id !== id); save(); }

    function addShopItem(e) {
      e.preventDefault();
      const title = document.getElementById('item-title').value;
      const cost = parseInt(document.getElementById('item-cost').value);
      if (!userData.shop) userData.shop = [];
      userData.shop.push({ id: Date.now(), title, cost });
      document.getElementById('item-title').value = '';
      document.getElementById('item-cost').value = '';
      save();
    }

    function buyItem(id) {
      const item = userData.shop.find(s => s.id === id);
      if (!item) return;
      if (userData.gold >= item.cost) {
        userData.gold -= item.cost;
        showToast(`Bought: ${item.title}! 🎁`);
        save();
      } else alert('Not enough gold!');
    }

    function deleteShopItem(id) { userData.shop = userData.shop.filter(s => s.id !== id); save(); }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 3000);
    }

    // INTERVAL VOOR TIMERS, DEADLINES EN MELDINGEN
    setInterval(() => {
      if (!userData || !userData.quests) return;
      const now = new Date().getTime();
      let hasChanges = false;

      userData.quests = userData.quests.filter(q => {
        if (q.dueDate) {
          const dueTime = new Date(q.dueDate).getTime();
          const timeLeft = dueTime - now;

          // Minder dan 15 minuten over
          if (timeLeft > 0 && timeLeft <= 15 * 60 * 1000 && !q.warned) {
            q.warned = true;
            hasChanges = true;
            sendNotification('⏰ Deadline Nabij!', `Je hebt nog minder dan 15 minuten voor: "${q.title}"!`);
          }

          // Verlopen deadline
          if (now >= dueTime) {
            showToast(`❌ Quest expired: "${q.title}"!`);
            sendNotification('❌ Quest Verlopen', `De deadline voor "${q.title}" is verstreken.`);
            hasChanges = true;
            return false;
          }
        }
        return true;
      });

      // Timers bijwerken
      userData.quests.forEach(q => {
        if (q.type === 'timer' && q.isRunning) {
          if (q.remainingSeconds > 0) {
            q.remainingSeconds--;
            const disp = document.getElementById(`time-disp-${q.id}`);
            if (disp) disp.innerText = `⏱️ ${formatTime(q.remainingSeconds)}`;
          } else {
            q.isRunning = false;
            sendNotification('⏱️ Timer Afgelopen!', `De timer voor "${q.title}" is klaar!`);
            completeQuest(q.id);
          }
        }
      });

      if (hasChanges) save();
    }, 1000);
  </script>

  <!-- PWA SERVICE WORKER REGISTRATIE -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('Service Worker geregistreerd!', reg);

          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                sendNotification('🚀 Nieuwe App Update!', 'Er is een nieuwe versie van Life RPG beschikbaar. Herlaad je pagina!');
              }
            });
          });
        }).catch(err => console.log('Service Worker fout:', err));
      });
    }
  </script>
